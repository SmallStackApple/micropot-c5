<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TL-WR841N</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef1f5;margin:0;text-align:center}
.logo{background:#4acbd6;color:#fff;padding:10px 0;font-size:22px;font-weight:bold}
.box{display:inline-block;background:#fff;padding:26px 40px;margin-top:60px;border:1px solid #cfd8e3;border-radius:6px}
h3{color:#4a4a4a;margin-top:0}
input{display:block;margin:10px auto;padding:8px;width:200px;border:1px solid #b9c3cf;border-radius:3px}
button{padding:8px 40px;background:#4acbd6;color:#fff;border:0;border-radius:3px;cursor:pointer}
.err{color:#d9534f;margin-top:12px}
</style>
</head>
<body>
<div class="logo">TP-LINK</div>
<div class="box">
<h3>TL-WR841N Wireless Router</h3>
<form method="POST" action="/login">
<input name="username" placeholder="User Name">
<input name="password" type="password" placeholder="Password">
<button type="submit">Login</button>
</form>
<div class="err">Incorrect username or password.</div>
</div>
</body>
</html>
