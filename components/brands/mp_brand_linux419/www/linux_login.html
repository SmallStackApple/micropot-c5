<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Index of /</title>
<style>
body{background:#f6f6f6;color:#222;font-family:Helvetica,Arial,sans-serif;margin:0}
.header{background:#d9d9d9;border-bottom:1px solid #bbb;padding:12px 22px}
.header h1{margin:0;font-size:20px;color:#444}
h2{color:#8a1f11;text-align:center;margin-top:60px}
.box{width:340px;margin:0 auto;background:#fff;border:1px solid #ccc;padding:24px 30px;border-radius:4px;box-shadow:0 1px 4px #0002}
input{display:block;box-sizing:border-box;margin:10px 0;padding:8px;width:100%;border:1px solid #aaa;border-radius:3px}
button{padding:8px 26px;background:#4a7ebb;color:#fff;border:0;border-radius:3px;cursor:pointer}
.note{margin-top:16px;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="header"><h1>Apache/2.4.38 (Unix) Server</h1></div>
<h2>401 Unauthorized</h2>
<div class="box">
<p style="text-align:center;color:#555;font-size:13px">Authentication required. Please log in to continue.</p>
<form method="POST" action="/login">
<input name="username" placeholder="Username" autocomplete="off">
<input name="password" type="password" placeholder="Password">
<button type="submit">Log In</button>
</form>
</div>
<div class="note">Apache/2.4.38 (Unix) Server at linux Port 80</div>
</body>
</html>
