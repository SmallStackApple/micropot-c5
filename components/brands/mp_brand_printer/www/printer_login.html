<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HP Embedded Web Server</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;margin:0;text-align:center}
.top{background:#0096d6;color:#fff;padding:12px 0;font-size:20px;font-weight:bold}
.box{display:inline-block;background:#fff;padding:26px 40px;margin-top:60px;border:1px solid #d3d8de}
h3{color:#333;margin-top:0}
input{display:block;margin:10px auto;padding:8px;width:200px;border:1px solid #b9c3cf}
button{padding:8px 40px;background:#0096d6;color:#fff;border:0;cursor:pointer}
.note{margin-top:12px;font-size:12px;color:#889}
</style>
</head>
<body>
<div class="top">HP LaserJet Pro MFP M428fdw</div>
<div class="box">
<h3>Embedded Web Server</h3>
<form method="POST" action="/login">
<input name="username" placeholder="User Name">
<input name="password" type="password" placeholder="Password">
<button type="submit">Sign In</button>
</form>
<div class="note">Default administrator PIN: 0000</div>
</div>
</body>
</html>
